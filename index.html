<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff0f5" />
  <title>A tiny question 💗</title>
  <style>
    :root {
      --pink: #ff6f9f;
      --deep: #e94d83;
      --ink: #63384d;
      --cream: #fffafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 22px;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, #ffe0eb 0 7%, transparent 7.5%),
        radial-gradient(circle at 85% 78%, #ffe3ed 0 9%, transparent 9.5%),
        linear-gradient(145deg, #fff5f8, #ffeaf2 55%, #fff7fa);
    }
    .sparkle {
      position: fixed;
      color: #f5a5c0;
      opacity: .55;
      pointer-events: none;
      animation: bob 4s ease-in-out infinite;
      user-select: none;
    }
    .s1 { top: 9%; left: 9%; font-size: 28px; }
    .s2 { top: 17%; right: 11%; font-size: 20px; animation-delay: -1s; }
    .s3 { bottom: 12%; left: 13%; font-size: 22px; animation-delay: -2s; }
    .s4 { bottom: 16%; right: 9%; font-size: 30px; animation-delay: -.5s; }
    @keyframes bob { 50% { transform: translateY(-12px) rotate(12deg); } }

    .card {
      width: min(100%, 440px);
      padding: clamp(25px, 7vw, 42px) 22px 30px;
      text-align: center;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(255,255,255,.95);
      border-radius: 30px;
      box-shadow: 0 18px 55px rgba(191, 91, 130, .16);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 1;
    }
    .bear {
      width: 112px;
      height: 112px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 36px;
      background: #fff0f5;
      font-size: 66px;
      box-shadow: inset 0 0 0 1px #ffe1eb;
      animation: heartbeat 2s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      8% { transform: scale(1.06); }
      16% { transform: scale(1); }
      24% { transform: scale(1.04); }
    }
    .eyebrow {
      margin: 0 0 9px;
      color: #d8799c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.13;
      letter-spacing: -.04em;
    }
    .sub {
      margin: 13px 0 25px;
      color: #987183;
      font-size: 15px;
      line-height: 1.55;
    }
    .play-area {
      position: relative;
      height: 125px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      border-radius: 22px;
      background: #fff7fa;
      border: 1px dashed #f7c5d6;
      overflow: hidden;
      touch-action: manipulation;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 27px;
      min-width: 112px;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 14px rgba(200, 91, 132, .16);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    button:active { transform: scale(.96); }
    #yes {
      position: absolute;
      left: 14px;
      top: 39px;
      color: white;
      background: linear-gradient(135deg, #ff82aa, #ed5c91);
      z-index: 2;
    }
    #yes:hover { box-shadow: 0 9px 20px rgba(237, 92, 145, .3); }
    #no {
      position: absolute;
      left: 190px;
      top: 39px;
      color: #9c7183;
      background: #fce2eb;
      z-index: 3;
      transition: left .16s ease, top .16s ease, transform .16s ease;
    }
    .hint {
      margin: 13px 0 0;
      color: #b18b9b;
      font-size: 12px;
    }
    .footer {
      margin-top: 22px;
      color: #c08ca2;
      font-size: 12px;
    }
    .success h1 { color: var(--deep); }
    .success .bear { animation: none; }
    .success .sub { font-size: 17px; color: #8b5e73; }
    .heart {
      position: fixed;
      bottom: -30px;
      z-index: 5;
      pointer-events: none;
      animation: rise linear forwards;
    }
    @keyframes rise {
      to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
    }
    @media (max-width: 380px) {
      .play-area { height: 142px; }
      #yes { left: 10px; top: 48px; min-width: 104px; }
      #no { left: 160px; top: 48px; min-width: 104px; }
      .card { padding-inline: 17px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <span class="sparkle s1">✦</span><span class="sparkle s2">♡</span>
  <span class="sparkle s3">✧</span><span class="sparkle s4">♡</span>

  <main class="card" id="card">
    <div class="bear" id="bear" aria-hidden="true">🧸</div>
    <p class="eyebrow">a very important question</p>
    <h1 id="title">Do you like me? 💗</h1>
    <p class="sub" id="sub">Choose wisely… this bear is emotionally invested.</p>

    <div class="play-area" id="playArea" aria-label="Choose yes or no">
      <button id="yes" type="button">YES! 💖</button>
      <button id="no" type="button">No 🙈</button>
    </div>
    <p class="hint" id="hint">Psst… try tapping NO. I dare you.</p>
    <div class="footer" id="footer">made with a tiny bit of courage & lots of love</div>
  </main>

  <script>
    const area = document.getElementById('playArea');
    const no = document.getElementById('no');
    const yes = document.getElementById('yes');
    const card = document.getElementById('card');
    let dodges = 0;

    function moveNo() {
      const bounds = area.getBoundingClientRect();
      const button = no.getBoundingClientRect();
      const maxX = Math.max(0, bounds.width - button.width - 8);
      const maxY = Math.max(0, bounds.height - button.height - 8);
      let x, y;
      // Pick a new spot that is noticeably different from the current one.
      const oldX = parseFloat(no.style.left) || no.offsetLeft;
      const oldY = parseFloat(no.style.top) || no.offsetTop;
      let tries = 0;
      do {
        x = 4 + Math.random() * Math.max(0, maxX - 4);
        y = 4 + Math.random() * Math.max(0, maxY - 4);
        tries++;
      } while (tries < 12 && Math.hypot(x - oldX, y - oldY) < 65);
      no.style.left = `${Math.min(x, maxX)}px`;
      no.style.top = `${Math.min(y, maxY)}px`;
      dodges++;
      const hints = [
        "Hehe, too slow 😜",
        "The NO button has commitment issues 🏃",
        "Are you sure? Think again! 💞",
        "It's getting shy now 🙈",
        "Maybe the universe is saying YES? ✨"
      ];
      document.getElementById('hint').textContent = hints[Math.min(dodges - 1, hints.length - 1)];
    }

    // Desktop: dodge as the pointer approaches. Mobile: dodge on touch, before click.
    no.addEventListener('pointerenter', moveNo);
    no.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      moveNo();
    });
    no.addEventListener('click', (event) => {
      event.preventDefault();
      moveNo();
    });
    no.addEventListener('focus', moveNo);

    yes.addEventListener('click', () => {
      card.classList.add('success');
      document.getElementById('bear').textContent = '🥰';
      document.getElementById('title').textContent = 'YAYYY! I knew it! 💕';
      document.getElementById('sub').textContent = 'You just made my whole day. Consider this your virtual hug. 🤗';
      area.innerHTML = '<div style="height:100%;display:grid;place-items:center;color:#e65d91;font-weight:800;font-size:18px;">💗 best decision ever 💗</div>';
      document.getElementById('hint').textContent = 'Sending you a million tiny hearts…';
      document.getElementById('footer').textContent = 'okay, now smile. you look cute. ✨';
      for (let i = 0; i < 28; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = ['💗','💕','💖','✨','💘'][Math.floor(Math.random() * 5)];
          heart.style.left = `${Math.random() * 100}vw`;
          heart.style.fontSize = `${16 + Math.random() * 22}px`;
          heart.style.animationDuration = `${3 + Math.random() * 3}s`;
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 6500);
        }, i * 90);
      }
    });
  </script>
</body>
</html>
